<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Arena ambient lighting -->
    <radialGradient id="arenaLight" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#142c4c"/>
      <stop offset="40%" stop-color="#0b1b30"/>
      <stop offset="85%" stop-color="#050d18"/>
      <stop offset="100%" stop-color="#02060b"/>
    </radialGradient>

    <!-- Overhead arena spotlight on mat -->
    <radialGradient id="matSpotlight" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4da0ff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#1d64b4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#091b30" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Royal Blue Mat Surface -->
    <linearGradient id="matSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154a8a"/>
      <stop offset="50%" stop-color="#1a5bb0"/>
      <stop offset="100%" stop-color="#0f396e"/>
    </linearGradient>

    <!-- Mat vinyl highlight -->
    <linearGradient id="matSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Inner gold circle gradient -->
    <radialGradient id="centerCircleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Drop shadow for mat elevation -->
    <filter id="matShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Soft glow for boundary lines -->
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Arena Background -->
  <rect width="1920" height="1080" fill="url(#arenaLight)"/>

  <!-- Stadium Floodlights Glow Effect -->
  <circle cx="960" cy="540" r="850" fill="url(#matSpotlight)"/>

  <!-- Competition Mat Container -->
  <g filter="url(#matShadow)">
    <!-- Square Wrestling Mat (Vibrant Royal Blue) -->
    <rect x="360" y="40" width="1200" height="1000" rx="20" fill="url(#matSurface)" stroke="#2563eb" stroke-width="3"/>
    <rect x="360" y="40" width="1200" height="1000" rx="20" fill="url(#matSheen)"/>

    <!-- Mat section tape seams (authentic foam section joins) -->
    <line x1="660" y1="40" x2="660" y2="1040" stroke="#0e2a4f" stroke-width="4" stroke-opacity="0.45"/>
    <line x1="960" y1="40" x2="960" y2="1040" stroke="#0e2a4f" stroke-width="4" stroke-opacity="0.45"/>
    <line x1="1260" y1="40" x2="1260" y2="1040" stroke="#0e2a4f" stroke-width="4" stroke-opacity="0.45"/>

    <!-- Red Corner Protection Zone (Top-Left) -->
    <path d="M360 40 L520 40 L360 200 Z" fill="#dc2626" fill-opacity="0.85"/>
    <!-- Green Corner Protection Zone (Bottom-Right) -->
    <path d="M1560 880 L1560 1040 L1400 1040 Z" fill="#16a34a" fill-opacity="0.85"/>

    <!-- Outer Protection Boundary (10-meter / 28-foot contest area) -->
    <!-- Vivid Gold / Amber Boundary Ring -->
    <circle cx="960" cy="540" r="410" fill="none" stroke="#f59e0b" stroke-width="14" filter="url(#lineGlow)"/>
    <circle cx="960" cy="540" r="410" fill="none" stroke="#fef08a" stroke-width="4"/>

    <!-- Inner Circle Zone (10-foot inner circle) -->
    <circle cx="960" cy="540" r="150" fill="url(#centerCircleGlow)"/>
    <circle cx="960" cy="540" r="150" fill="none" stroke="#f59e0b" stroke-width="10" stroke-dasharray="14 8" stroke-opacity="0.9"/>
    <circle cx="960" cy="540" r="150" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Center Referee Starting Lines (Red & Green lines, 10" apart, 3' long) -->
    <!-- Red Wrestler Start Line -->
    <line x1="915" y1="510" x2="1005" y2="510" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <!-- Green Wrestler Start Line -->
    <line x1="915" y1="570" x2="1005" y2="570" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>

    <!-- Center Point Dot -->
    <circle cx="960" cy="540" r="5" fill="#f8fafc"/>
  </g>
</svg>
